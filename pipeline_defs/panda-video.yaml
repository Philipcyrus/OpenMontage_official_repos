name: panda-video
version: "1.0"
description: >
  Panda Mobile video pipeline. Agent-driven production that mirrors upstream OpenMontage's
  Animated Explainer architecture, with five human-approval gates: script, scene_plan
  (TEXT), stills, assets (all generated media), and final video. The scene_plan stage produces ONLY
  a structured text plan (no media, no generation tools); ALL media (stills, clips, voice,
  music) is generated in the assets stage and recorded canonically in asset_manifest.
  Generation runs through the Higgsfield MCP bridge + ElevenLabs. The compose stage is
  runtime-routed (upstream-style) on edit_decisions.render_runtime: ffmpeg -> panda_render
  (folded montage-svc, CLEAN default), remotion/hyperframes -> video_compose. The output is
  always a CLEAN (unbranded) master. Panda branding (logo/watermark/cards) is applied ONLY on
  explicit user request AFTER approval, via the standalone panda_brand tool — never baked in.
category: hybrid
stability: production             # schema allows only production|beta
default_checkpoint_policy: guided

orchestration:
  mode: executive-producer
  # NOTE: reuses the hybrid executive-producer (functional in production). A panda-video-specific
  # EP is a future specialization, not a blocker.
  skill: pipelines/hybrid/executive-producer
  budget_default_usd: 10.00         # USD governance ceiling (estimates); Higgsfield bills in credits
  max_revisions_per_stage: 3
  max_send_backs: 3
  max_wall_time_minutes: 60         # a full 5-gate run (real Higgsfield generation) takes ~40 min

extensions:
  custom_scripts: true
  custom_playbooks: true
  custom_skills: true
  custom_tools: true               # we add montage_svc_compose + the higgsfield_mcp bridge

required_skills:
  # NOTE: idea/script reuse hybrid's directors where noted. Edit is panda-video-specific
  # (ungated → compose; VO overrun default) — not hybrid footage-led edit.
  - pipelines/hybrid/executive-producer
  - pipelines/panda-video/idea-director          # OUR internal idea (no gate); replaces hybrid's gated one
  - pipelines/hybrid/script-director
  - pipelines/panda-video/scene-plan-director    # OUR text-only scene planner (no media)
  - pipelines/panda-video/asset-director         # OUR asset generator (all media -> asset_manifest)
  - pipelines/panda-video/edit-director          # OUR ungated edit → compose (not hybrid footage edit)
  - pipelines/panda-video/compose-director       # OUR runtime-routed compose (ffmpeg/remotion/hyperframes)
  - meta/higgsfield-mcp-bridge                   # OUR bridge protocol (ported from OpenMontage-main)
  - meta/reviewer
  - meta/checkpoint-protocol

compatible_playbooks:
  recommended:
    - panda
  custom_allowed: true

stages:
  # ---- research / proposal : internal, NO gate ----
  - name: idea
    skill: pipelines/panda-video/idea-director   # OUR internal idea (no gate; brief + decision_log)
    produces:
      - brief
      - decision_log
    tools_available: []
    checkpoint_required: true
    human_approval_default: false      # INTERNAL — no human pause; agent writes 'completed' -> script

  # ---- GATE 1 : approve script ----
  - name: script
    skill: pipelines/hybrid/script-director
    required_artifacts_in:
      - brief
    produces:
      - script
    tools_available: []
    checkpoint_required: true
    human_approval_default: true       # 🚦 GATE 1
    review_focus:
      - Narrative, timing, and voice cues match the brief
      - Runtime is realistic for the platform

  # ---- GATE 2 : approve the TEXT scene plan (no media generated here) ----
  # Upstream contract: scene_plan is a structured production plan only. NO generation tools
  # are available; NO stills/contact-sheet/media are produced. The reviewer approves the
  # written plan (timings, scene types, framing, movement, camera, character actions,
  # transitions, and the required_assets each scene declares for the assets stage to fulfil).
  - name: scene_plan
    skill: pipelines/panda-video/scene-plan-director
    required_artifacts_in:
      - script
    produces:
      - scene_plan          # structured TEXT plan only (schemas/artifacts/scene_plan.schema.json)
    tools_available: []      # no generation tools at planning time (upstream-faithful)
    checkpoint_required: true
    human_approval_default: true       # 🚦 GATE 2 (approve the text scene plan)
    review_focus:
      - Full script duration is covered with realistic per-scene timings, no gaps
      - Each scene carries the 5 aspects — subject, subject motion, scene, spatial framing, camera (shot_language)
      - Narrative structure is specified — narrative_role + shot_intent per scene, exactly one hero_moment
      - Narration word budget fits the runtime (85-90%, ~2-3 words/sec)
      - Every required_asset is feasible with the tools available in the assets stage
      - Panda identity / character-consistency (Element ids + character_actions) / composition are specified as plan requirements

  # ---- GATES 2.5, 3, 3.5 & 4 : the ASSETS stage runs in human-reviewed phases ----
  # Best-of-both: upstream's single asset-generation stage, PLUS Panda cost gates. The stage
  # pauses (all status='awaiting_human', stage='assets'), distinguished by
  # checkpoint partial_progress.phase:
  #   PHASE 0  partial_progress.phase="hero_still"    -> 🚦 GATE 2.5 approve_hero_still
  #            (default ON; opt out with job option hero_still:false)
  #            generate ONE hero still (look lock) before the full storyboard.
  #   PHASE 1  partial_progress.phase="stills"        -> 🚦 GATE 3 approve_stills
  #            remaining stills (or all when hero_still off). NO video yet.
  #   PHASE 2  partial_progress.phase="motion_sample" -> 🚦 GATE 3.5 approve_motion_sample
  #            (only when job option motion_sample is on — DEFAULT OFF; pass true to opt in)
  #   PHASE 3  (no phase marker)                       -> 🚦 GATE 4 approve_assets
  #   BUDGET   partial_progress.phase="budget_hold"    -> 🚦 budget_exceeded (CONDITIONAL)
  # The assets stage is gated (framework assets-gate-flip). See dify_launcher/runner.py.
  - name: assets
    skill: pipelines/panda-video/asset-director
    required_artifacts_in:
      - scene_plan
      - script
    produces:
      - asset_manifest
    tools_available:
      - image_selector           # PHASE 0/1: stills per scene (still-gen via the Higgsfield MCP bridge)
      - elevenlabs_tts           # PHASE 2/3: TTS-FIRST — generate VO before i2v so clip duration can follow audio
      - audio_probe              # PHASE 2/3: probe VO duration for snap_i2v_duration
      - higgsfield_mcp_video     # PHASE 2/3: OUR MCP bridge (image_to_video); duration from measured VO
      - seedance_video
      - music_gen                # PHASE 3: background music (ElevenLabs Music)
    checkpoint_required: true
    human_approval_default: true       # 🚦 GATES 2.5, 3, 3.5 & 4
    review_focus:
      - "PHASE 0 (hero still): one look-lock still approved before the full storyboard (default on; hero_still:false skips)"
      - "PHASE 1 (stills): one still per scene, on-brand (styles/panda.yaml) and character-consistent (panda Elements), before any video is generated"
      - "PHASE 2 (motion sample): one hero clip approves the motion/animation before the full batch (only if motion_sample:true; default off); narrated sample scenes TTS + duration snap before i2v"
      - "PHASE 3 (media): TTS-first then duration-driven i2v — narration before clips; when audio_lipsync on (default), customer/panda clips use seedance_2_0 + audio_references + generate_audio:false (HOLD fallback on failure); every required asset on disk in asset_manifest (path + scene_id)"
      - "Budget: cumulative Higgsfield credits stay within max_higgsfield_credits (if set); overruns hard-block before spend, not after"
      - Narration covers all script sections; music (if any) sits under the VO
      - Reviewer can approve the set or request revision of specific scenes/shots (regenerate only those)

  # ---- edit decisions : NO gate ----
  # edit_decisions MUST carry render_runtime (ffmpeg|remotion|hyperframes), chosen per the
  # render-runtime decision (job option render_runtime, or auto → upstream decision matrix +
  # on-box availability). Compose reads it and routes. Carry it forward UNCHANGED unless a
  # render_runtime_selection decision is logged (silent swap = governance violation).
  - name: edit
    skill: pipelines/panda-video/edit-director
    required_artifacts_in:
      - scene_plan
      - asset_manifest
    produces:
      - edit_decisions          # includes render_runtime (see schemas/artifacts/edit_decisions.schema.json)
    tools_available: []
    checkpoint_required: true
    human_approval_default: false

  # ---- compose : CLEAN render (no branding), runtime-routed ----
  # Routes on edit_decisions.render_runtime (upstream-style):
  #   ffmpeg     -> panda_render   (folded montage-svc, in-process, CLEAN/ugc — the Panda default)
  #   remotion   -> video_compose  (React motion graphics; needs Node>=22 + remotion-composer)
  #   hyperframes-> video_compose  (HTML/CSS/GSAP; needs Node>=22 + Chrome headless)
  # See skills/pipelines/panda-video/compose-director.md.
  - name: compose
    skill: pipelines/panda-video/compose-director
    required_artifacts_in:
      - edit_decisions
      - asset_manifest
    produces:
      - render_report
      - final_review
    required_tools:
      - panda_render        # folded montage-svc render (in-process). CLEAN/ugc profile. ffmpeg lane.
    tools_available:
      - panda_render        # ffmpeg lane (default)
      - video_compose       # remotion / hyperframes lanes (runtime-aware)
    checkpoint_required: true
    human_approval_default: true       # 🚦 GATE 5 (approve the finished video)
    review_focus:
      - Clean master is correct (assembly, captions, audio, grade) — NO branding yet
      - final.mp4 exists and passes ffprobe
    # NOTE: branding is NOT applied here. The Panda logo/watermark/cards are added ONLY on
    # explicit user request AFTER this video is approved, via the standalone panda_brand tool
    # (an /overlay-style pass on the approved master). See memory openmontage-render-fold-and-branding.
