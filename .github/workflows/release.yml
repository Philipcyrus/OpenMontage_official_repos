name: Release

# Every push to main (a merged PR or a direct push) gets the next version tag and
# a GitHub Release. GitHub writes the notes from the pull requests merged since
# the previous release, grouped by .github/release.yml.
#
# The merged PR's label picks the bump: none = minor (v0.9.0 -> v0.10.0),
# `release:patch`, `release:major`, or `release:skip` for no release.
# Run it by hand (Actions -> Release -> Run workflow) to release main's current
# commit when an earlier push was skipped.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options:
          - minor
          - patch
          - major
        default: minor

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish the next release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_INPUT: ${{ inputs.bump }}
        run: bash .github/scripts/next-release.sh
